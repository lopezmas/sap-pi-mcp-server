[project]
name = "sap-pi-mcp-server"
version = "0.1.0"
description = "Local MCP server for SAP PI monitoring and Integration Directory metadata"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.31.0",
]

[tool.setuptools]
py-modules = ["get_pi_channel_status", "export_value_mappings_csv"]
packages = ["mcp", "mcp.server"]
